name: Release

on:
  push:
    branches: [main]

jobs:
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @auren/schemas build
      - run: pnpm --filter @auren/registry build

      - run: pnpm typecheck
      - run: pnpm test

  deploy-registry:
    name: Deploy Registry to Vercel
    runs-on: ubuntu-latest
    needs: check
    environment:
      name: production
      url: https://auren.elmerjacobo.dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:publish

      - name: Deploy Registry to Vercel
        working-directory: dist/public-registry
        run: npx --yes vercel@53.2.0 deploy --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  publish-npm:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    needs: check
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Build all workspace packages first
      - run: pnpm --filter @auren/schemas build
      - run: pnpm --filter @auren/registry build
      - run: pnpm --filter @auren/core build
      - run: pnpm --filter @auren/cli build

      # Bundle the CLI
      - run: node packages/cli/scripts/bundle-npm.mjs

      - name: Publish to npm
        run: cd dist/npm-pkg && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
